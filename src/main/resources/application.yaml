spring:
  application:
    name: gateway-service
  cloud:
    consul:
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT}
      discovery:
        healthCheckPath: /actuator/health
        healthCheckInterval: 20s
        enabled: true
        prefer-ip-address: true
        #ip-address: localhost
    inetutils:
      ignored-interfaces: eth0
    gateway:
      default-filters:
        #        - RewritePath=/(?<base>.*?)/(?<segment>.*)/ping, /ping
        #        - RewritePath=/(?<base>.*?)/(?<segment>.*), /$\{segment}
         #TokenRelay=
         #RemoveRequestHeader=Cookie
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/users 
          filters:
            - RewritePath=/(?<base>.*?)/(?<segment>.*)/ping, /ping
            - RewritePath=/(?<base>.*?)/(?<segment>.*), /$\{segment}
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
          filters:
            - RewritePath=/(?<base>.*?)/(?<segment>.*)/ping, /ping
            - RewritePath=/(?<base>.*?)/(?<segment>.*), /$\{segment}
        - id: event-emission-service
          uri: lb://event-emission-service
          predicates:
            - Path=/api/emission/**
          filters:
            - RewritePath=/(?<base>.*?)/(?<segment>.*)/ping, /ping
            - RewritePath=/(?<base>.*?)/(?<segment>.*), /$\{segment}

  #datasource:
   # driver-class-name: com.mysql.cj.jdbc.Driver
    #password: ${DB_PASSWORD}
    #username: ${DB_USERNAME}
    #url: ${CD_DB_URL}
  #jpa:
    #show-sql: true
    #hibernate:
     # ddl-auto: none
    #properties:
     # hibernate:
      #  dialect: org.hibernate.dialect.MySQL8Dialect
    
management:
  endpoints:
    health:
      show-details: always
      db:
        enabled: false
    web:
      exposure:
        include: health
        base-path: /actuator
    
server:
  port: ${PORT:80}

apigateway:
  port: ${API_GATEWAY_PORT:80}

      
logging:  
  level:
    org.dozer: "debug"
    org.hibernate: "error"    
    org:
      springframework:
        cloud:
          gateway: DEBUG
